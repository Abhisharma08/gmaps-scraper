services:
  scraper:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Required in any deployment - without it the tool is open to anyone.
      APP_PASSWORD: "${APP_PASSWORD:?set APP_PASSWORD in .env}"
      # Keeps sessions valid across restarts. Generate: openssl rand -hex 32
      APP_SECRET: "${APP_SECRET:?set APP_SECRET in .env}"
      # Set once you serve over HTTPS.
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      MAX_CONCURRENT_JOBS: "${MAX_CONCURRENT_JOBS:-2}"
      # Datacenter IPs get blocked by Google Maps; "api" is the safer default.
      DEFAULT_SOURCE: "${DEFAULT_SOURCE:-browser}"
    # Chromium is memory-hungry; give it room or jobs die mid-scrape.
    mem_limit: 2g
    shm_size: 1gb
    restart: unless-stopped
