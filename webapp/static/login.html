<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in &middot; Google Maps Scraper</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181f; --muted: #667085;
    --line: #e3e6eb; --accent: #2563eb; --bad: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ebef; --muted: #98a2b3;
      --line: #2a3039; --accent: #4f8cff; --bad: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    grid-template-rows: 1fr auto; padding: 0 16px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  form {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 30px; width: min(380px, 92vw);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    width: 100%; margin-top: 16px; padding: 10px; font: inherit; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  .err {
    color: var(--bad); font-size: 13.5px; margin-top: 14px; text-align: center;
  }
  .credit { color: var(--muted); font-size: 12.5px; line-height: 1.9; padding: 20px 0; text-align: center; }
  .credit a { color: var(--ink); font-weight: 600; text-decoration: none; }
  .credit a:hover { color: var(--accent); }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Google Maps Scraper</h1>
  <p class="sub">Enter the team password to continue.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autofocus autocomplete="current-password">
  <button type="submit">Sign in</button>
  <div class="err" id="err" hidden>Incorrect password.</div>
  <script>
    if (location.search.includes('error')) document.getElementById('err').hidden = false;
  </script>
</form>
<footer class="credit">
  Built by <a href="https://opervia.tech/" target="_blank" rel="noopener">Opervia</a> &middot; independent software studio
  <br>
  <a href="https://github.com/Abhisharma08/gmaps-scraper" target="_blank" rel="noopener">&#9733; Star on GitHub</a>
  &middot;
  <a href="https://github.com/Abhisharma08" target="_blank" rel="noopener">@Abhisharma08</a>
</footer>
</body>
</html>
